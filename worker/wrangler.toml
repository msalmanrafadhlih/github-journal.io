name = "github-journal-stats"
main = "src/index.js"
compatibility_date = "2026-09-12"

# Non-secret config. GITHUB_TOKEN is set separately as a secret — see
# worker/README.md — never put tokens in this file.
[vars]
# How long a successful response stays cached at Cloudflare's edge before
# the next visitor triggers a fresh GraphQL fetch. Raise this if you want
# to spend even less of GitHub's rate limit; lower it for fresher data.
CACHE_TTL_SECONDS = "300"

# Restrict which origins may call this Worker from a browser. "*" is fine
# to start, but once your GitHub Pages URL is known, lock it down, e.g.
# "https://msalmanrafadhlih.github.io"
ALLOWED_ORIGIN = "*"

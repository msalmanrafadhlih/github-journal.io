name: Deploy Github Journal

on:
  push:
    branches: [main]
  schedule:
    # Refreshes data.json (and redeploys) every 6 hours even with no new
    # commits, so contribution/star counts stay close to real-time.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# Only one deployment at a time; a newer run cancels an in-progress older one.
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fetch-stats
            main

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked

      # [1/3] Live data. Uses the default GITHUB_TOKEN, which is enough to
      # read public profile/contribution data via GraphQL. If you also want
      # private contributions counted, add a PAT with `read:user` scope as
      # a repo secret named STATS_TOKEN and this will pick it up instead.
      - name: Fetch live GitHub stats
        run: cargo run --release --manifest-path fetch-stats/Cargo.toml -- data.json
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # [2/3] Build the site. base_path is injected here (not committed) so
      # local `dx serve` keeps working without it — see Dioxus.toml.
      - name: Configure base path for this repo
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            BASE_PATH="/"
          else
            BASE_PATH="$REPO_NAME"
          fi
          echo "Deploying with base_path = $BASE_PATH"
          printf '\n[web.app]\nbase_path = "%s"\n' "$BASE_PATH" >> main/Dioxus.toml

      - name: Build with dx
        working-directory: main
        run: dx bundle --release --out-dir dist

      - name: Assemble the deploy output
        run: |
          mv main/dist/public/* main/dist/
          rmdir main/dist/public
          cp main/dist/index.html main/dist/404.html
          cp data.json main/dist/data.json

      # [3/3] Hand the finished folder to GitHub Pages.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

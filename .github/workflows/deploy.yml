name: Deploy Github Journal

on:
  push:
    branches: [main]
    paths-ignore:
      - "worker/**"
  workflow_dispatch: {}
# No more `schedule:` cron here — the site now fetches live data at
# runtime from the Cloudflare Worker in worker/ (see deploy-worker.yml),
# so there's nothing left for a periodic rebuild to refresh.

# Only one deployment at a time; a newer run cancels an in-progress older one.
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: main

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked

      # [1/2] Build the site. base_path is injected here (not committed) so
      # local `dx serve` keeps working without it — see Dioxus.toml.
      - name: Configure base path for this repo
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            BASE_PATH="/"
          else
            BASE_PATH="$REPO_NAME"
          fi
          echo "Deploying with base_path = $BASE_PATH"
          printf '\n[web.app]\nbase_path = "%s"\n' "$BASE_PATH" >> main/Dioxus.toml

      - name: Build with dx
        working-directory: main
        run: dx bundle --release --out-dir dist

      - name: Assemble the deploy output
        run: |
          mv main/dist/public/* main/dist/
          rmdir main/dist/public
          cp main/dist/index.html main/dist/404.html

      # [2/2] Hand the finished folder to GitHub Pages. Live data itself is
      # fetched client-side at runtime from the Worker in worker/ — nothing
      # data-related to bundle here anymore.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
